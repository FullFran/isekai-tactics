<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isekai Tactics</title>
    <style>
      :root { color-scheme: dark; --ink: #10131c; --card: #1b2030; --line: #2e3550; --text: #e8ecf5; --dim: #9aa3bd; --player: #5b8ef0; --enemy: #e0625b; }
      body { margin: 0; background: var(--ink); color: var(--text); font-family: ui-monospace, monospace; font-size: 14px; }
      #app { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
      .board { position: relative; }
      canvas { display: block; max-width: 100%; height: auto; border: 2px solid var(--line); border-radius: 6px; image-rendering: pixelated; cursor: pointer; }
      aside { flex: 1; min-width: 280px; max-width: 380px; display: flex; flex-direction: column; gap: 10px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
      .card.player { border-left: 4px solid var(--player); }
      .card.enemy { border-left: 4px solid var(--enemy); }
      h1, h2, h3, h4 { margin: 0 0 6px; }
      h2 { font-size: 17px; } h3 { font-size: 15px; } h4 { font-size: 14px; }
      p { margin: 3px 0; }
      .dim { color: var(--dim); }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 10px; margin-top: 4px; }
      .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .side.player h4 { color: var(--player); } .side.enemy h4 { color: var(--enemy); }
      .log p { font-size: 12px; }
      .help { font-size: 12px; }
      button, select { font: inherit; background: #2a3150; color: var(--text); border: 1px solid #46507a; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      button:hover { background: #36406a; }
      button.disabled { opacity: 0.45; pointer-events: none; }
      .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 10, 16, 0.72); border-radius: 6px; }
      .overlay[hidden] { display: none; }
      .screen { text-align: center; background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 18px 28px; }
      .screen.victory h1 { color: #ffd34d; } .screen.defeat h1 { color: var(--enemy); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
